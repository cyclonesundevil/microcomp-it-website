[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "microcomp-llm-reference"
version = "0.1.0"
description = "Deterministic educational reference implementation for the MicroComp IT LLM Training Simulation Lab"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.5.1",
    "torch==2.13.0"
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1"
]

[project.scripts]
microcomp-llm = "microcomp_llm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["microcomp_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
